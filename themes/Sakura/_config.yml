# ===========================================================
# hexo-theme-sakura 主题配置（本站）
# 上游：https://github.com/honjun/hexo-theme-sakura
# 主题已放进 themes/Sakura 并纳入本仓库，改动随站点一起版本管理。
# ===========================================================

# 站点名（prefixName 是标题前的小字，siteName 是主名）
prefixName: 星屑ノート
siteName: acsRef

favicon: /img/seal.svg
# 用 GitHub 上的头像（改这个 URL 就能换）
avatar: https://github.com/acsRef.png?size=200
url: https://acsref.github.io
description: 月下点墨，落樱为记 —— 代码、随笔与日常

# 主题自带的静态资源 CDN（字体、图标、pjax 等）
# cdn 置空：否则模板会把头像/社交图标也拼到作者 CDN 上，显示成别人的图。
# 字体图标走 lib.min.css 里写死的 jsdelivr 地址，不用这个变量。
cdn: ''
pjax: 1
mathjax: 0

notice: 这里放代码笔记、读过的书，和一些走神的时刻。
lazyloadImg: /img/loading.svg

menus:
  首页: { path: /, fa: fa-fort-awesome faa-shake }
  归档: { path: /archives, fa: fa-archive faa-shake }
  标签: { path: /tags, fa: fa-tags faa-vertical }
  分类: { path: /categories, fa: fa-folder-open faa-vertical }
  关于: { path: /about, fa: fa-leaf faa-wrench }

# 首页文章排序：-1 新的在前
homePageSortType: -1
homeArticleShown: 10

# 首屏背景图：dragonbaby308 站点的壁纸（源在他的 DragonBaby308/cdn 仓库 img/bg/）
#
# 为什么不直接写 jsdelivr 地址：国内访问 cdn.jsdelivr.net 经常超时/被墙，
# 而且 bg1.jpg 原图有 4MB。
# 这里改成走 wsrv.nl 图片代理：由它去取原图、顺便缩到 1920 宽 + 质量 80，
# 浏览器实际只下载 200KB 左右的 JPEG，既绕开了 jsdelivr，也快得多。
# 想彻底不依赖任何外链：把图片放进 source/img/bg/，这里改成 /img/bg/xxx.jpg。
bg:
  - 'https://wsrv.nl/?url=cdn.jsdelivr.net/gh/DragonBaby308/cdn@2.1/img/bg/sakura.jpg&w=1920&output=jpg&q=80'
  - 'https://wsrv.nl/?url=cdn.jsdelivr.net/gh/DragonBaby308/cdn@2.1/img/bg/bg2.jpg&w=1920&output=jpg&q=80'
  - 'https://wsrv.nl/?url=cdn.jsdelivr.net/gh/DragonBaby308/cdn@2.1/img/bg/bg3.jpg&w=1920&output=jpg&q=80'
  - 'https://wsrv.nl/?url=cdn.jsdelivr.net/gh/DragonBaby308/cdn@2.1/img/bg/bg4.jpg&w=1920&output=jpg&q=80'
  - 'https://wsrv.nl/?url=cdn.jsdelivr.net/gh/DragonBaby308/cdn@2.1/img/bg/bg1.jpg&w=1920&output=jpg&q=80'

# 背景样式：filter-dim 阴影 / filter-grid 横条 / filter-dot 点点
bgclass: filter-dot

# 首屏下方的入口卡片（留空则不显示）
startdash: []

# 建站时间（页脚计时用）
siteBuildingTime: 11/04/2026

# 社交（PC 端）
social:
  github: { url: https://github.com/acsRef, img: /img/social/github.svg }
  email: { url: mailto:1803887234@qq.com, img: /img/social/email.svg }

# 社交（移动端）
msocial:
  github: { url: https://github.com/acsRef, fa: fa-github, color: 23201c }
  email: { url: mailto:1803887234@qq.com, fa: fa-envelope, color: b03a2e }

# 赞赏页（留空，避免出现别人的收款码）
donate:
  paypal:
  alipay:
  wechat:
  wechatSQ:

# 首页视频（关掉）
movies:
  url:
  name:

# 音乐播放器：已移除（模板不再引入 APlayer/Meting，配置留空即可）
aplayer:

# 评论：Valine 需要 LeanCloud 账号，先关
valine: false
v_appId:
v_appKey:

waline:
  enable: false
  serverURL:
  visitor: false
  comment_count: true
  avatar: mp
  guest_info: nick
  pageSize: 10
  placeholder: 说点什么吧～
  requiredFields: [ 'nick','mail' ]
  background:
