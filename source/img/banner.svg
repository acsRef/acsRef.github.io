<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="深夜星空与月">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#100a20"/>
      <stop offset="0.5" stop-color="#2a1a4a"/>
      <stop offset="0.82" stop-color="#4a2a60"/>
      <stop offset="1" stop-color="#6d3a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffc9e0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffc9e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9ecd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9ecd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2350"/>
      <stop offset="1" stop-color="#251537"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241537"/>
      <stop offset="1" stop-color="#150c22"/>
    </linearGradient>
    <pattern id="stars" width="260" height="200" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="26" r="1.5" fill="#fff" opacity="0.85"/>
      <circle cx="74" cy="88" r="1" fill="#fff" opacity="0.55"/>
      <circle cx="120" cy="40" r="2" fill="#ffe9c4" opacity="0.9"/>
      <circle cx="168" cy="132" r="1.2" fill="#fff" opacity="0.7"/>
      <circle cx="212" cy="62" r="1" fill="#cfe3ff" opacity="0.8"/>
      <circle cx="242" cy="176" r="1.6" fill="#fff" opacity="0.6"/>
      <circle cx="46" cy="152" r="1" fill="#fff" opacity="0.45"/>
      <circle cx="146" cy="188" r="0.9" fill="#fff" opacity="0.5"/>
      <circle cx="96" cy="118" r="0.8" fill="#fff" opacity="0.4"/>
      <circle cx="196" cy="20" r="1.1" fill="#fff" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1920" height="600" fill="url(#sky)"/>
  <rect width="1920" height="600" fill="url(#stars)"/>
  <ellipse cx="960" cy="640" rx="900" ry="260" fill="url(#horizon)"/>

  <!-- 月亮与光晕 -->
  <circle cx="1500" cy="150" r="260" fill="url(#glow)"/>
  <circle cx="1500" cy="150" r="74" fill="#fff6e6"/>
  <circle cx="1470" cy="128" r="66" fill="#1c1134" opacity="0.92"/>
  <circle cx="1474" cy="132" r="66" fill="#2a1a4a" opacity="0.35"/>

  <!-- 远山 -->
  <path d="M0 470 L180 392 L330 448 L520 356 L700 452 L880 380 L1070 456 L1260 372 L1450 448 L1650 386 L1920 466 L1920 600 L0 600 Z" fill="url(#hillBack)" opacity="0.85"/>
  <!-- 近景山丘 -->
  <path d="M0 520 L220 462 L430 522 L640 470 L860 536 L1080 486 L1300 540 L1520 494 L1740 546 L1920 512 L1920 600 L0 600 Z" fill="url(#hillFront)"/>

  <!-- 远处的鸟居剪影 -->
  <g fill="#120a1e" opacity="0.9">
    <rect x="1600" y="452" width="10" height="120"/>
    <rect x="1712" y="452" width="10" height="120"/>
    <rect x="1584" y="436" width="154" height="12" rx="5"/>
    <rect x="1592" y="462" width="138" height="8" rx="4"/>
  </g>

  <!-- 飘落的花瓣 -->
  <g fill="#ffb7d5" opacity="0.8">
    <ellipse cx="220" cy="180" rx="7" ry="4" transform="rotate(-24 220 180)"/>
    <ellipse cx="360" cy="300" rx="6" ry="3.4" transform="rotate(18 360 300)" opacity="0.7"/>
    <ellipse cx="540" cy="120" rx="5" ry="3" transform="rotate(-38 540 120)" opacity="0.6"/>
    <ellipse cx="760" cy="250" rx="7.5" ry="4.2" transform="rotate(32 760 250)" opacity="0.55"/>
    <ellipse cx="980" cy="88" rx="5" ry="3" transform="rotate(-14 980 88)" opacity="0.5"/>
    <ellipse cx="1180" cy="330" rx="6.5" ry="3.6" transform="rotate(46 1180 330)" opacity="0.6"/>
    <ellipse cx="1340" cy="200" rx="5" ry="2.8" transform="rotate(-30 1340 200)" opacity="0.45"/>
  </g>
</svg>
