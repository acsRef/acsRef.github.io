<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="花窗与落樱">
  <defs>
    <linearGradient id="c3bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#232a36"/>
      <stop offset="0.5" stop-color="#2c3038"/>
      <stop offset="1" stop-color="#463a40"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ecd2" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#efd9b0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#efd9b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lattice" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M0 28 H56 M28 0 V56" stroke="#0f141b" stroke-width="5"/>
      <path d="M0 0 L56 56 M56 0 L0 56" stroke="#0f141b" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#c3bg)"/>
  <circle cx="400" cy="250" r="230" fill="url(#windowGlow)"/>

  <!-- 窗洞 -->
  <clipPath id="roundWin"><circle cx="400" cy="250" r="150"/></clipPath>
  <g clip-path="url(#roundWin)">
    <rect x="250" y="100" width="300" height="300" fill="#f6e7c8" opacity="0.14"/>
    <rect x="250" y="100" width="300" height="300" fill="url(#lattice)" opacity="0.85"/>
    <!-- 窗外远山 -->
    <path d="M250 330 L320 290 L380 330 L440 285 L510 330 L550 310 L550 400 L250 400 Z" fill="#141a22" opacity="0.55"/>
    <circle cx="470" cy="190" r="26" fill="#f7efdc" opacity="0.8"/>
  </g>
  <circle cx="400" cy="250" r="150" fill="none" stroke="#0d1218" stroke-width="7"/>
  <circle cx="400" cy="250" r="157" fill="none" stroke="#b03a2e" stroke-opacity="0.28" stroke-width="2"/>

  <!-- 垂樱 -->
  <g stroke="#0d1119" stroke-width="5" fill="none" opacity="0.9">
    <path d="M-10 60 C120 96 210 170 250 260"/>
    <path d="M120 116 C170 170 196 220 210 280"/>
  </g>
  <g fill="#e9aebd" opacity="0.9">
    <circle cx="196" cy="196" r="11"/>
    <circle cx="216" cy="230" r="8"/>
    <circle cx="178" cy="238" r="9"/>
    <circle cx="238" cy="264" r="7"/>
    <circle cx="162" cy="272" r="8"/>
    <circle cx="206" cy="292" r="6.5"/>
    <circle cx="128" cy="152" r="7"/>
    <circle cx="104" cy="190" r="6"/>
    <circle cx="146" cy="112" r="5.5"/>
  </g>
  <g fill="#f7d6de" opacity="0.65">
    <circle cx="196" cy="196" r="4.6"/>
    <circle cx="178" cy="238" r="3.8"/>
    <circle cx="162" cy="272" r="3.2"/>
  </g>

  <!-- 飘落 -->
  <g fill="#f0c1cd" opacity="0.7">
    <ellipse cx="330" cy="360" rx="7" ry="4" transform="rotate(-22 330 360)"/>
    <ellipse cx="470" cy="420" rx="6" ry="3.4" transform="rotate(26 470 420)"/>
    <ellipse cx="620" cy="360" rx="5.5" ry="3.1" transform="rotate(-36 620 360)"/>
    <ellipse cx="700" cy="230" rx="5" ry="2.8" transform="rotate(12 700 230)"/>
  </g>

  <!-- 朱印 -->
  <g opacity="0.9">
    <rect x="712" y="432" width="46" height="46" rx="3" fill="#b03a2e"/>
    <rect x="717" y="437" width="36" height="36" rx="1.5" fill="none" stroke="#fdf6ea" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="735" y="463" font-family="'LXGW WenKai','KaiTi',serif" font-size="20" fill="#fdf6ea" text-anchor="middle">屑</text>
  </g>
</svg>
