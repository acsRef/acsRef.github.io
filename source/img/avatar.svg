<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="月与星的头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a4a"/>
      <stop offset="1" stop-color="#7b3a72"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#ffe0c2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9ec" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="118" cy="78" r="62" fill="url(#halo)"/>
  <circle cx="118" cy="78" r="40" fill="url(#moon)"/>
  <circle cx="102" cy="66" r="36" fill="#2b1a4d"/>
  <g fill="#fff6e6">
    <circle cx="62" cy="128" r="3.2"/>
    <circle cx="150" cy="136" r="2.4" opacity="0.85"/>
    <circle cx="86" cy="164" r="2" opacity="0.7"/>
    <circle cx="166" cy="52" r="2.6" opacity="0.9"/>
    <circle cx="40" cy="60" r="1.8" opacity="0.6"/>
  </g>
  <g fill="#ffb7d5" opacity="0.85">
    <ellipse cx="52" cy="100" rx="4.4" ry="2.6" transform="rotate(-28 52 100)"/>
    <ellipse cx="140" cy="170" rx="4" ry="2.3" transform="rotate(24 140 170)" opacity="0.7"/>
  </g>
