<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="星屑朱印">
  <defs>
    <linearGradient id="cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8452f"/>
      <stop offset="0.6" stop-color="#b03a2e"/>
      <stop offset="1" stop-color="#98322a"/>
    </linearGradient>
    <filter id="worn">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="68" height="68" rx="4" fill="url(#cinnabar)"/>
  <rect x="7" y="7" width="58" height="58" rx="2" fill="none" stroke="#fdf6ea" stroke-opacity="0.55" stroke-width="1.4"/>
  <g fill="#fdf6ea" font-family="'LXGW WenKai','KaiTi',serif" font-size="24" text-anchor="middle">
    <text x="36" y="32">星</text>
    <text x="36" y="58">屑</text>
  </g>
  <rect x="2" y="2" width="68" height="68" rx="4" filter="url(#worn)" opacity="0.35"/>
</svg>
