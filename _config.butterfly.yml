# Butterfly 主题配置（覆盖主题自带的默认值）
# 参考文档：https://butterfly.js.org/

# ---------------- 导航栏 ----------------
nav:
  logo: /img/avatar.svg
  display_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# ---------------- 社交图标 ----------------
social:
  fab fa-github: https://github.com/acsRef || Github || '#6b4b8a'
  fas fa-envelope: mailto:1803887234@qq.com || Email || '#e0518a'

# ---------------- 图片 ----------------
favicon: /img/avatar.svg

avatar:
  img: /img/avatar.svg
  effect: false

disable_top_img: false
index_img: /img/banner.svg
default_top_img: /img/banner.svg
archive_img: /img/banner.svg
tag_img: /img/banner.svg
category_img: /img/banner.svg

cover:
  index_enable: true
  aside_enable: true
  archives_enable: false
  position: both
  default_cover:
    - /img/banner.svg

# ---------------- 首页文章卡片 ----------------
index_post_content:
  method: 2
  length: 220

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# ---------------- 配色 ----------------
# 深夜蓝紫 + 樱花粉
theme_color:
  enable: true
  main: '#ff6fa5'
  paginator: '#a98bff'
  button_hover: '#ff9ecd'
  text_selection: '#ffb7d5'
  link_color: '#7d5ba6'
  meta_color: '#8a7f99'
  hr_color: '#ffd0e2'
  code_foreground: '#e0518a'
  code_background: 'rgba(125, 91, 166, .07)'
  toc_color: '#a98bff'
  blockquote_padding_color: '#ff9ecd'
  blockquote_background_color: '#ff9ecd'
  scrollbar_color: '#ffb7d5'

# 网站背景：从月光白到浅樱粉的渐变
background: 'linear-gradient(180deg, #fdf9ff 0%, #f5edff 38%, #ffeef7 72%, #fff6fb 100%)'

# ---------------- 字体 ----------------
# 标题用霞鹜文楷（开源中文手写风字体），正文保持系统字体以便阅读
blog_title_font:
  font_link: https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css
  font-family: '"LXGW WenKai", "LXGW WenKai Screen", "PingFang SC", "Microsoft YaHei", sans-serif'

font:
  global-font-size: 15px

# ---------------- 首页标题区 ----------------
index_site_info_top: 40%
index_top_img_height: 92vh

subtitle:
  enable: true
  effect: true
  source: false
  sub: 代码、番剧和日常，都写成星屑

# ---------------- 动效 ----------------
enter_transitions: true
darkmode:
  enable: true
  button: true
  autoChangeMode: 1  # 跟随系统，系统不支持时 18:00-06:00 自动切暗色
display_mode: light
rightside_scroll_percent: true

beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#ff6fa5'

# ---------------- 搜索 ----------------
local_search:
  enable: true
  preload: true
  top_n_per_article: 1
  unescape: false

# ---------------- 侧边栏 ----------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 记录二次元与代码的角落
    button:
      enable: true
      icon: fab fa-github
      text: 关注 GitHub
      link: https://github.com/acsRef
  card_announcement:
    enable: true
    content: 欢迎来到星屑ノート ✨ <br>这里放番剧感想、代码笔记和一些日常。
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 30
    color: true
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    limit: 6
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 文章底部「编辑」按钮，直接跳到 GitHub 网页编辑
post_edit:
  enable: true
  url: https://github.com/acsRef/acsRef.github.io/edit/main/source/

# ---------------- 页脚 ----------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text: 星屑ノート · 用 Hexo 与 Butterfly 搭建
  copyright: true

# ---------------- 注入自定义资源 ----------------
inject:
  head:
    - <link rel="stylesheet" href="/css/anime.css">
  bottom:
    - <script src="/js/sakura.js" defer></script>
