# Butterfly 主题配置（覆盖主题自带的默认值）
# 参考文档：https://butterfly.js.org/

# ---------------- 导航栏 ----------------
nav:
  logo: /img/avatar.svg
  display_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# ---------------- 社交图标 ----------------
social:
  fab fa-github: https://github.com/acsRef || Github || '#23201c'
  fas fa-envelope: mailto:1803887234@qq.com || Email || '#b03a2e'

# ---------------- 图片 ----------------
favicon: /img/seal.svg

avatar:
  img: /img/avatar.svg
  effect: false

disable_top_img: false
index_img: /img/hero-ink.svg
default_top_img: /img/hero-ink.svg
archive_img: /img/hero-ink.svg
tag_img: /img/hero-ink.svg
category_img: /img/hero-ink.svg

cover:
  index_enable: true
  aside_enable: true
  archives_enable: false
  position: both
  default_cover:
    # 没写 cover 的文章会从这里随机挑一张，三张轮着来不会撞脸
    - /img/hero-ink.svg
    - /img/cover-bamboo.svg
    - /img/cover-window.svg

# ---------------- 首页文章卡片 ----------------
index_post_content:
  method: 2
  length: 220

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# ---------------- 配色 ----------------
# 国风：墨、宣纸、朱砂、泥金
theme_color:
  enable: true
  main: '#b03a2e'
  paginator: '#2f3e52'
  button_hover: '#c85a45'
  text_selection: '#e6cdae'
  link_color: '#a04a38'
  meta_color: '#8c8478'
  hr_color: '#d8c9b0'
  code_foreground: '#b03a2e'
  code_background: 'rgba(176, 58, 46, .07)'
  toc_color: '#b03a2e'
  blockquote_padding_color: '#b03a2e'
  blockquote_background_color: '#b03a2e'
  scrollbar_color: '#c2ad92'

# 代码块换成墨色主题，和宣纸底更搭
highlight_theme: pale night

# 网站背景：宣纸色渐变（纸纹由 anime.css 叠在上面）
background: 'linear-gradient(180deg, #fbf7ef 0%, #f8f3e9 42%, #f3ead9 72%, #efe3cf 100%)'

# ---------------- 字体 ----------------
# 霞鹜文楷：开源中文楷体风格字体，正好是古风需要的调子
blog_title_font:
  font_link: https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css
  font-family: '"LXGW WenKai", "LXGW WenKai Screen", "KaiTi", "STKaiti", "Songti SC", serif'

font:
  global-font-size: 15px
  font-family: '"LXGW WenKai", "LXGW WenKai Screen", "KaiTi", "Songti SC", "Microsoft YaHei", serif'

# ---------------- 首页标题区 ----------------
index_site_info_top: 40%
index_top_img_height: 96vh

subtitle:
  enable: true
  effect: true
  source: false
  # 注意：sub 必须是数组，写成单个字符串 typed.js 会报 strings.map 错误
  sub:
    - 月下点墨，落樱为记
    - 拾几枚星屑，记几页闲话
    - 国风 × 二次元 × 代码

# ---------------- 动效 ----------------
enter_transitions: true

# 这版是浅色的「月光+樱花」设计，暗色模式下玻璃卡片会显得突兀，
# 所以先关掉暗色模式。以后想开：把 enable 改成 true，
# 再在 source/css/anime.css 里补一组 [data-theme="dark"] 的配色即可。
darkmode:
  enable: false
  button: false
  autoChangeMode: false

display_mode: light
rightside_scroll_percent: true

beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#b03a2e'

# ---------------- 搜索 ----------------
local_search:
  enable: true
  preload: true
  top_n_per_article: 1
  unescape: false

# ---------------- 侧边栏 ----------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 月下点墨，落樱为记
    button:
      enable: true
      icon: fab fa-github
      text: 来 GitHub 找我
      link: https://github.com/acsRef
  card_announcement:
    enable: true
    content: 星屑ノート · 拾几枚星屑，记几页闲话 <br>番剧、代码、与一些走神的时刻。
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 30
    color: true
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    limit: 6
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 文章底部「编辑」按钮，直接跳到 GitHub 网页编辑
post_edit:
  enable: true
  url: https://github.com/acsRef/acsRef.github.io/edit/main/source/

# ---------------- 页脚 ----------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text: 星屑ノート · 墨与樱
  copyright: true

# ---------------- 注入自定义资源 ----------------
inject:
  head:
    - <link rel="stylesheet" href="/css/anime.css">
  bottom:
    - <script src="/js/sakura.js" defer></script>
    # 看板娘：只引主包。L2Dwidget.min.js 会自己用 jsonp 去拉同目录的 L2Dwidget.0.min.js，
    # 手动引那个分包会因为 webpackJsonpL2Dwidget 还没定义而报错。
    - <script src="/live2d/lib/L2Dwidget.min.js"></script>
    - <script src="/js/live2d.js" defer></script>
