# Hexo 站点配置
# 官方文档：https://hexo.io/docs/configuration

# ---------------- 站点信息 ----------------
title: acsRef
subtitle: '星屑ノート —— 月下点墨，落樱为记'
description: 'acsRef 的个人博客 —— 代码、随笔与日常'
keywords: 博客,前端,Python,Hexo,笔记
author: acsRef
language: zh-CN
timezone: 'Asia/Shanghai'

# ---------------- 网址 ----------------
# 这是你的用户名站点，地址固定为 https://<用户名>.github.io
url: https://acsref.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------------- 目录 ----------------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------------- 写作 ----------------
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  # 不要行号，代码块保持干净
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: false
  tab_replace: ''

# ---------------- 首页 / 分页 ----------------
index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: 未分类
category_map:
tag_map:

# ---------------- 日期格式 ----------------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# ---------------- 分页 ----------------
per_page: 8
pagination_dir: page

# ---------------- 本地搜索 ----------------
# 配合主题的 local_search 使用，生成 public/search.xml
search:
  path: search.xml
  field: post
  content: true
  format: html
  limit: 10000

# ---------------- 主题 ----------------
theme: Sakura
# ---------------- 部署 ----------------
# 本博客用 GitHub Actions 构建发布，所以这里留空。
# 如果以后想在本地一条命令部署，再看 README 里的「本地部署」一节。
deploy:
  type: ''

# sakura 主题的搜索数据
jsonContent:
  enable: true
  file: content.json
  # keyword-extractor 不支持中文，关掉关键词提取
  keywords: false
  path:
    posts:
      title: title
      date: date
      path: path
      text: text
      excerpt: excerpt
      categories: categories
      tags: tags

# 首页 RSS
feed:
  type: atom
  path: atom.xml
  limit: 20

# ---------------- 文章加密（hexo-blog-encrypt v4） ----------------
# 用法：在想加密的文章 front-matter 里加一行 password: 你的密码
# 没有 password 的文章照常公开。
# 注意：内容以 AES 密文输出，页面本身公开，弱密码可能被离线爆破，
# 真正敏感的东西不要放公网。
#
# 注意配置项叫 encrypt（v4 已不再使用 blog_encrypt）
encrypt:
  abstract: 这篇文章已加密，输入密码后查看。
  message: 请输入访问密码
  theme: default
  wrong_pass_message: 密码不对，再试一次。

  # 把派生出的密钥缓存进浏览器 localStorage（键名 hbe.v4.<页面路径>）
  # 效果：同一台设备、同一篇文章，输过一次密码后刷新/再访问都不用再输。
  autoSave: true

  # 让 salt 由 permalink 派生。GitHub Actions 每次都是全新构建，
  # 不开启的话每次部署生成的 salt 都会变，缓存就会失效、又要重新输密码。
  stableSalt: true

  # PBKDF2 迭代次数，越高越难被暴力破解，但打开也越慢
  kdf:
    iterations: 250000

  decryptButton:
    show: true
    text: 解密
